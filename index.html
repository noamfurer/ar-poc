<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15151c">
<title>מר יסודות - AR</title>
<script src="./vendor/aframe.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>
<script src="./mascot.js?v=30"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15151c;font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;isolation:isolate}#stage a-scene{width:100%;height:100%}
#status{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;padding:12px;border-radius:14px;background:#15151cd9;text-align:center;font-size:14px;pointer-events:none}
#status.found{background:#bd1734e8}
#hint{position:fixed;z-index:20;bottom:max(18px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font-size:13px;line-height:1.6;background:#15151cc9;padding:10px;border-radius:12px;pointer-events:none}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;background:#faf7f3;color:#25252d}
#intro[hidden]{display:none}#intro img{width:130px;border-radius:24px}h1{margin:24px 0 10px;font-size:30px}p{max-width:330px;line-height:1.7;margin:6px 0 22px}
button{font:700 18px Arial;color:white;background:#ca1e3b;border:0;border-radius:16px;padding:16px 35px;cursor:pointer}button:disabled{opacity:.6}a{color:#a31930;margin-top:22px;font-size:14px}.a-enter-vr{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">טוען את הדמות...</div>
<div id="hint">הנח את הלוגו שטוח על השולחן. כוון מלמעלה בזווית קלה, כשהלוגו תופס כחצי מרוחב המסך.</div>
<div id="intro"><img src="./assets/logo_target.png" alt="הלוגו האדום"><h1>מר יסודות קופץ לביקור</h1><p>מניחים את הלוגו על השולחן, פותחים מצלמה ונותנים לו להתעורר.</p><button id="start">פתיחת מצלמה</button><a href="./marker.html">הלוגו להדפסה</a></div>
<script>
const statusEl = document.getElementById('status');
const start = document.getElementById('start');
let scene;
start.addEventListener('click', async () => {
  start.disabled = true;
  start.textContent = 'מפעיל מצלמה...';
  try {
    if (!window.AFRAME || !AFRAME.systems['mindar-image-system']) throw new Error('ספריית ה-AR לא נטענה. בדוק חיבור ורענן.');
    if (!scene) {
      document.getElementById('stage').innerHTML = `
      <a-scene embedded mindar-image="imageTargetSrc: ./assets/logo_target.mind?v=30; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 4; missTolerance: 8;" renderer="alpha: true; colorManagement: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets timeout="30000"><a-asset-item id="robotModel" src="./assets/robot_builder_mascot_v3.glb?v=30"></a-asset-item></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>
        <a-entity id="logoTarget" mindar-image-target="targetIndex: 0">
          <a-entity table-occluder></a-entity>
          <a-entity id="robot" gltf-model="#robotModel" mascot-performance></a-entity>
        </a-entity>
      </a-scene>`;
      scene = document.querySelector('a-scene');
      scene.addEventListener('arReady', () => { statusEl.textContent = 'המצלמה פעילה - כוון ללוגו האדום'; });
      scene.addEventListener('arError', () => { statusEl.textContent = 'לא ניתן להפעיל מצלמה. בדוק הרשאה ופתח ב-Chrome או ב-Safari.'; });
      document.getElementById('logoTarget').addEventListener('targetFound', () => {
        statusEl.textContent = 'הלוגו זוהה - מר יסודות כאן!'; statusEl.classList.add('found');
      });
      document.getElementById('logoTarget').addEventListener('targetLost', () => {
        statusEl.textContent = 'כוון שוב ללוגו כדי להחזיר את מר יסודות'; statusEl.classList.remove('found');
      });
      if (!scene.hasLoaded) await new Promise(resolve => scene.addEventListener('loaded', resolve, {once:true}));
    }
    document.getElementById('intro').hidden = true;
    statusEl.textContent = 'מפעיל מצלמה...';
    await new Promise((resolve, reject) => {
      const ready = () => { cleanup(); resolve(); };
      const failed = () => { cleanup(); reject(new Error('לא ניתן להפעיל מצלמה. אשר גישה למצלמה ונסה שוב.')); };
      const cleanup = () => { scene.removeEventListener('arReady', ready); scene.removeEventListener('arError', failed); };
      scene.addEventListener('arReady', ready, {once:true});
      scene.addEventListener('arError', failed, {once:true});
      scene.systems['mindar-image-system'].start();
    });
  } catch(error) {
    console.error(error);
    document.getElementById('intro').hidden = false;
    document.querySelector('#intro p').textContent = error.message || 'בדוק הרשאת מצלמה ונסה שוב.';
  } finally { start.disabled = false; start.textContent = 'פתיחת מצלמה'; }
});
</script>
</body>
</html>
