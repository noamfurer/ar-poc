<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>AR.js Hiro Test</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const status = document.getElementById('status');
        this.el.addEventListener('markerFound', () => {
          status.textContent = 'HIRO FOUND - tracking works!';
          status.classList.add('found');
        });
        this.el.addEventListener('markerLost', () => {
          status.textContent = 'Camera active - point at the full Hiro marker';
          status.classList.remove('found');
        });
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    #status {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.72);
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    #status.found {
      background: rgba(0,130,60,.9);
    }
    #help {
      position: fixed;
      z-index: 20;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.62);
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }
    .a-enter-vr,
    .a-orientation-modal {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="status">Starting camera...</div>
  <div id="help">Do not scan the QR again. After the site opens, point the camera at the entire Hiro marker, including its full black border.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-marker preset="hiro" emitevents="true" marker-status>
      <a-box
        position="0 0.5 0"
        depth="0.7"
        height="0.7"
        width="0.7"
        material="color: #ff1f1f; opacity: 0.92;"
      ></a-box>
      <a-sphere
        position="0 1.15 0"
        radius="0.22"
        material="color: #ffffff;"
      ></a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');

    function updateCameraStatus() {
      const video =
        document.querySelector('#arjs-video') ||
        document.querySelector('video');

      if (video && video.readyState >= 2 && video.videoWidth > 0) {
        if (!status.classList.contains('found')) {
          status.textContent = 'Camera active - point at the full Hiro marker';
        }
        return true;
      }
      return false;
    }

    let attempts = 0;
    const timer = setInterval(() => {
      attempts += 1;
      if (updateCameraStatus() || attempts > 40) {
        clearInterval(timer);
        if (attempts > 40 && !updateCameraStatus()) {
          status.textContent = 'Camera did not initialize correctly';
        }
      }
    }, 250);

    window.addEventListener('camera-error', () => {
      status.textContent = 'Camera error - check browser camera permission';
    });
  </script>
</body>
</html>
