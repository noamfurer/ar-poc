<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>MindAR Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
    .example-container{
      overflow:hidden;
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      background:#000;
    }
    .example-container a-scene{
      position:fixed!important;
      inset:0!important;
      width:100vw!important;
      height:100dvh!important;
    }
    .example-container canvas,
    .example-container .a-canvas{
      position:fixed!important;
      inset:0!important;
      width:100vw!important;
      height:100dvh!important;
    }
    .example-container video,
    video.mindar-video{
      position:fixed!important;
      inset:0!important;
      width:100vw!important;
      height:100dvh!important;
      object-fit:cover!important;
    }
    #status{
      direction:rtl;
      position:fixed;z-index:99999;
      top:max(12px,env(safe-area-inset-top));left:12px;right:12px;
      padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.72);color:#fff;
      text-align:center;font-weight:700;font-size:14px;backdrop-filter:blur(8px);pointer-events:none
    }
    #status.found{background:rgba(0,130,60,.9)}
    #hint{
      direction:rtl;
      position:fixed;z-index:99999;
      bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;
      padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;
      text-align:center;font-size:12px;line-height:1.4;pointer-events:none
    }
    .a-enter-vr,.a-orientation-modal{display:none!important}
  </style>

  <script>
    AFRAME.registerComponent('target-status', {
      init: function () {
        const status = document.getElementById('status');
        this.el.addEventListener('targetFound', () => {
          status.textContent = 'זוהה! ה-AR עובד';
          status.classList.add('found');
        });
        this.el.addEventListener('targetLost', () => {
          status.textContent = 'המצלמה פעילה - כוון לתמונת היעד';
          status.classList.remove('found');
        });
      }
    });
  </script>
</head>
<body>
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="card" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" target-status>
        <a-plane src="#card" position="0 0 0" height="0.552" width="1"></a-plane>
        <a-box
          position="0 0.35 0.2"
          width="0.45"
          height="0.45"
          depth="0.45"
          material="color:#ff2020;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3500; easing: linear"
        ></a-box>
      </a-entity>
    </a-scene>
  </div>

  <div id="status">מפעיל מצלמה...</div>
  <div id="hint">כוון את המצלמה לתמונת היעד שבדף השני. כשהיא מזוהה תופיע קובייה אדומה.</div>

  <script>
    const scene = document.querySelector('a-scene');
    const status = document.getElementById('status');

    scene.addEventListener('arReady', () => {
      status.textContent = 'המצלמה פעילה - כוון לתמונת היעד';
    });

    scene.addEventListener('arError', () => {
      status.textContent = 'שגיאת AR - רענן את הדף ונסה שוב';
    });

    function forceFullscreenLayers(){
      document.querySelectorAll('video').forEach(v=>{
        v.style.position='fixed';
        v.style.inset='0';
        v.style.width='100vw';
        v.style.height='100dvh';
        v.style.objectFit='cover';
      });
      document.querySelectorAll('canvas').forEach(c=>{
        c.style.position='fixed';
        c.style.inset='0';
        c.style.width='100vw';
        c.style.height='100dvh';
      });
    }
    setInterval(forceFullscreenLayers,500);
    window.addEventListener('resize',forceFullscreenLayers);
  </script>
</body>
</html>
