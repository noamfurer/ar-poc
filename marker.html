<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hiro Marker</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:24px;color:#111}
    p{margin:0 0 20px;color:#555;text-align:center;max-width:620px;line-height:1.4}
    img{display:block;width:min(78vw,620px);height:auto;background:#fff}
    .note{margin-top:16px;font-size:13px;color:#666;text-align:center}
  </style>
</head>
<body>
  <h1>Hiro marker test</h1>
  <p>Open the AR page on your phone, then point the phone camera at this marker. Keep the complete black square and some white space around it visible.</p>
  <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro marker">
  <div class="note">For this test there is no QR code next to the marker.</div>
</body>
</html>
