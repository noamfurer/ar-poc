<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Printable WebAR Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9edf2; color: #10141a; font-family: Arial, Helvetica, sans-serif; padding: 24px; }
    .sheet { width: min(760px, 100%); background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,25,35,.16); text-align: center; }
    .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #69717d; }
    h1 { margin: 8px 0 8px; font-size: 30px; }
    p { margin: 0 auto 24px; max-width: 590px; line-height: 1.5; color: #58606b; }
    .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: center; margin-top: 28px; }
    .panel { border: 1px solid #dde3ea; border-radius: 20px; padding: 20px; min-height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .label { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
    #qrcode { width: 220px; height: 220px; display: grid; place-items: center; }
    #qrcode img, #qrcode canvas { max-width: 220px; max-height: 220px; }
    .marker { width: min(260px, 100%); display: block; }
    .small { margin-top: 13px; font-size: 12px; color: #737b86; line-height: 1.4; }
    button { margin-top: 24px; border: 0; border-radius: 12px; background: #10141a; color: white; font-weight: 700; padding: 13px 20px; font-size: 15px; cursor: pointer; }
    @media (max-width: 650px) { .steps { grid-template-columns: 1fr; } }
    @media print { body { background: #fff; padding: 0; } .sheet { box-shadow: none; border-radius: 0; width: 100%; } button { display: none; } }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="eyebrow">WebAR demo card</div>
    <h1>Scan, then point back at the marker</h1>
    <p>Use the QR code to open the AR page. Allow camera access, then point the phone at the black AR marker on this same card.</p>
    <section class="steps">
      <div class="panel">
        <div class="label">1. Scan this QR</div>
        <div id="qrcode"></div>
        <div class="small" id="targetUrl"></div>
      </div>
      <div class="panel">
        <div class="label">2. Point the AR camera here</div>
        <img class="marker" src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro AR marker" />
        <div class="small">Keep the full black border visible for stable tracking.</div>
      </div>
    </section>
    <button onclick="window.print()">Print card</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('url') || new URL('index.html', location.href).href;
    document.getElementById('targetUrl').textContent = target;
    new QRCode(document.getElementById('qrcode'), {
      text: target,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
