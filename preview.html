<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מר יסודות - תצוגה מקדימה</title><script src="./vendor/aframe.min.js"></script><script src="./speech.js?v=31"></script><script src="./mascot.js?v=31"></script><style>body{margin:0;font-family:Arial}#status{position:fixed;z-index:10;top:20px;left:0;right:0;text-align:center;color:#222}a{position:fixed;bottom:25px;z-index:10;left:35%;right:35%;text-align:center;color:#b11d39}</style></head><body><button id="previewStart" style="position:fixed;z-index:30;top:65px;left:calc(50% - 100px);width:200px;padding:14px;border:0;border-radius:12px;background:#ca1e3b;color:white;font:bold 16px Arial">הפעלת תצוגה עם קול</button><div id="status">תצוגה מקדימה של הדמות</div><a href="./">חזרה למצלמה</a><a-scene background="color:#f3f0eb" vr-mode-ui="enabled:false" renderer="colorManagement:true"><a-assets><a-asset-item id="model" src="./assets/robot_builder_mascot_v3.glb"></a-asset-item><img id="logo" src="./assets/logo_target.png"></a-assets><a-camera position="0 0.85 1.3" rotation="-13 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera><a-entity light="type:ambient;intensity:1.1"></a-entity><a-entity light="type:directional;intensity:1.5" position="1 2 3"></a-entity><a-plane width="8" height="8" rotation="-90 0 0" position="0 -.002 0" color="#e5ddd2"></a-plane><a-plane width="1" height="1" rotation="-90 0 0" material="src:#logo;shader:flat"></a-plane><a-entity id="previewTarget" mindar-image-target="" rotation="-90 0 0"><a-entity id="robot" gltf-model="#model" mascot-performance></a-entity></a-entity></a-scene><script>document.getElementById('previewStart').addEventListener('click',async function(){
this.disabled=true;
try{
await window.RobotSpeech.unlock();
const robot=document.getElementById('robot');
if(!robot.components['mascot-performance'].ready)await new Promise(resolve=>robot.addEventListener('model-loaded',resolve,{once:true}));

}catch(error){document.getElementById('status').textContent=error.message;this.disabled=false;}
});</script></body></html>
