name: Deploy WebAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild mascot GLB
        shell: bash
        run: |
          mkdir -p assets
          cat payload/v3/model/part*.b64 | tr -d '\n\r ' | base64 -d | xz -d > assets/robot_builder_mascot_v3.glb
          echo "0342ba5e897b0bee10f178c9a36d7210c0a240282d3ac9aa3c2537c14a2965c3  assets/robot_builder_mascot_v3.glb" | sha256sum -c -
          rm -rf payload

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
